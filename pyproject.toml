[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-org"
version = "0.1.0"
description = "Local PDF to Markdown/Org pipeline using MiniCPM-OCR and ollama"
requires-python = ">=3.12"
dependencies = [
  "minicpm-ocr[layout,pdf]==1.0.2",
  "paddlepaddle==3.3.1",
  "pypdfium2>=4",
]

[project.scripts]
pdf2org = "pdf_to_org.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_org"]
